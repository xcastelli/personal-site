<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arthur Bartholomew</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('hero.png') center/cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      animation: fadeUp 1.2s ease forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    .hero h1 {
      font-size: 90px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
    }

    .subtitle {
      margin-top: 25px;
      font-size: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 300;
    }

    footer {
      background: #ffffff;
      text-align: center;
      padding: 180px 20px 100px;
    }

    .last-name {
      font-size: 220px;
      font-weight: 900;
      letter-spacing: -6px;
      color: #111;
      line-height: 1;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 900px) {
      .hero h1 {
        font-size: 55px;
      }

      .last-name {
        font-size: 90px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Arthur Bartholomew</h1>
      <div class="subtitle">
        Entrepreneur | Commercial Cleaning Operator | Systems Builder
      </div>
    </div>
  </section>

  <footer>
    <div class="last-name">BARTHOLOMEW</div>
  </footer>

</body>
</html>
